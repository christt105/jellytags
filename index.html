<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JellyTags</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="stylesheet" href="/src/index.css" />
</head>

<body>
  <div class="app-container">
    <header class="glass-panel header-panel">
      <div class="header-title-group">
        <h1 class="header-title">
          JellyTags
        </h1>
        <div class="header-search header-search-wrapper">
          <input id="search-input" class="glass-input search-input-field" placeholder="Search by name or tag..." />
        </div>
        <button id="filters-toggle" class="glass-button header-button mobile-only" style="display: none;">
          Filters
        </button>
        <button id="sidebar-toggle" class="glass-button header-button mobile-only" style="display: none;">
          ☰
        </button>
      </div>

      <div class="header-actions">
        <select id="source-library-select" class="glass-input sort-select-field source-library-select-field">
          <option value="all" selected>All Libraries</option>
        </select>
        <select id="parental-rating-select" class="glass-input sort-select-field rating-select-field">
          <option value="all" selected>All Parental Ratings</option>
        </select>
        <select id="sort-select" class="glass-input sort-select-field">
          <option value="name-asc">Alphabetical (A-Z)</option>
          <option value="name-desc">Alphabetical (Z-A)</option>
          <option value="date-desc" selected>Date Added (Newest)</option>
          <option value="date-asc">Date Added (Oldest)</option>
        </select>
        <div id="tag-filter-wrapper" class="tag-filter-wrapper">
          <button id="tag-filter-toggle" type="button" class="glass-button header-button tag-filter-toggle-btn">
            Tags <span id="tag-filter-count" class="tag-filter-count"></span>
          </button>
          <div id="tag-filter-panel" class="glass-panel tag-filter-panel">
            <p class="tag-filter-hint">Click a tag to require it, click again to exclude it, once more to reset.</p>
            <div id="tag-filter-list" class="tag-filter-list"></div>
            <button id="tag-filter-clear" type="button" class="tag-filter-clear-btn">Clear tag filters</button>
          </div>
        </div>
        <button id="select-all-btn" class="glass-button header-button">
          Select All
        </button>
        <button id="refresh-btn" class="glass-button header-button">
          Refresh
        </button>
      </div>
    </header>

    <div class="main-layout">
      <div class="main-content">
        <div id="loading-indicator" class="loading-indicator">
          <h3>Loading your library...</h3>
        </div>
        <div id="media-grid" class="media-grid">
          <!-- Grid Items go here -->
        </div>
      </div>

      <div class="sidebar-container">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <div id="tag-editor-sidebar" class="glass-panel tag-editor-sidebar">
          <div class="sidebar-header">
            <h3 class="sidebar-title">Tag Editor</h3>
            <button id="sidebar-close" class="sidebar-close-btn mobile-only">&times;</button>
          </div>
          <p class="sidebar-empty-msg">Select items from the grid to edit their tags.</p>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <span class="app-footer-text">JellyTags &middot; Batch tag editor for Jellyfin</span>
      <nav class="app-footer-links">
        <a href="https://github.com/christt105/jellytags" target="_blank" rel="noopener noreferrer">
          <svg class="app-footer-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
          GitHub
        </a>
        <a href="https://ko-fi.com/christt105" target="_blank" rel="noopener noreferrer">Ko-fi</a>
      </nav>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
